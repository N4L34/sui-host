# Metrics, logs, and alerts. Chat is a separate Compose project.
name: monitoring

x-log: &jsonlog
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=:9090
    volumes:
      - ./platform/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./runtime/file_sd:/etc/prometheus/file_sd:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 1536M

  alertmanager:
    image: ${ALERTMANAGER_IMAGE}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    volumes:
      - ./runtime/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./platform/alertmanager/telegram.tmpl:/etc/alertmanager/telegram.tmpl:ro
      - ./runtime/telegram_token:/etc/alertmanager/telegram_token:ro
      - alert-data:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 128M

  blackbox:
    image: ${BLACKBOX_IMAGE}
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./platform/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 128M

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
      - ${TEXTFILE}:/textfile:ro
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 128M

  cadvisor:
    image: ${CADVISOR_IMAGE}
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock
    networks:
      - monitoring
    restart: unless-stopped
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./platform/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 1024M

  alloy:
    image: ${ALLOY_IMAGE}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ./platform/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks:
      - monitoring
    restart: unless-stopped
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 256M

  postgres-exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    user: "0:0"
    environment:
      DATA_SOURCE_URI: postgres:5432/synapse?sslmode=disable
      DATA_SOURCE_USER: synapse
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    volumes:
      - ${CHAT_SECRETS}/postgres_password:/run/secrets/postgres_password:ro
    networks:
      monitoring:
      chat_data:
    labels:
      monitoring.service: postgres
      monitoring.dns: postgres-exporter
      monitoring.metrics.port: "9187"
      monitoring.metrics.path: /metrics
      monitoring.name: База чата
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 128M

  grafana:
    image: ${GRAFANA_IMAGE}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        rm -f /tmp/grafana-admin-password
        tr -d '[:space:]' < /run/secrets/grafana_admin_password > /tmp/grafana-admin-password
        chown 472:472 /tmp/grafana-admin-password
        chmod 400 /tmp/grafana-admin-password
        exec su -s /bin/sh grafana -c 'export GF_SECURITY_ADMIN_PASSWORD="$$(tr -d "[:space:]" < /tmp/grafana-admin-password)"; exec /run.sh'
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://${MATRIX_SERVER_NAME}/
      GF_SERVER_ENABLE_GZIP: "true"
    volumes:
      - ${CHAT_SECRETS}/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
      - ./platform/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    labels:
      monitoring.service: grafana
      monitoring.dns: grafana
      monitoring.probe: http://grafana:3000/api/health
      monitoring.alert: page
      monitoring.name: Страницы
      monitoring.summary: "Страницы мониторинга не открываются."
      monitoring.resolved: "Страницы мониторинга снова открываются."
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    logging: *jsonlog
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  monitoring:
    external: true
    name: monitoring
  chat_data:
    external: true
    name: chat_data

volumes:
  prom-data:
    external: true
    name: svoi_prom-data
  alert-data:
    external: true
    name: svoi_alert-data
  loki-data:
    external: true
    name: svoi_loki-data
  alloy-data:
    external: true
    name: svoi_alloy-data
  grafana-data:
    external: true
    name: svoi_grafana-data
