global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/probes.json"]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: metrics
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/metrics.json"]
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [metrics_path]
        regex: (.+)
        target_label: __metrics_path__

  - job_name: platform
    static_configs:
      - targets:
          - prometheus:9090
          - alertmanager:9093
          - loki:3100
          - blackbox:9115

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
