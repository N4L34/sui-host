name: egress
services:
  proxy:
    image: sui-egress:2026.11.13
    build: .
    pull_policy: missing
    user: "1000:1000"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:mode=1777,size=16m"]
    volumes:
      - type: bind
        source: ./runtime
        target: /run/private
        bind: {create_host_path: false}
    networks:
      monitoring:
        aliases: [sui-egress]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    memswap_limit: 192M
    deploy:
      resources:
        limits: {memory: 192M, cpus: "1.0", pids: 128}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
    labels:
      monitoring.project: egress
      monitoring.service: proxy
      monitoring.dns: sui-egress
      monitoring.probe: http://sui-egress:8080/health
      monitoring.alert: page
      monitoring.name: Общий исходящий прокси
      monitoring.summary: Прокси не проходит сквозную проверку.
      monitoring.resolved: Прокси снова доступен.
networks:
  monitoring:
    external: true
    name: monitoring
