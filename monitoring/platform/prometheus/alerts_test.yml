rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'probe_success{job="probe", project="chat", service="synapse"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: HomeserverDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: probe
              project: chat
              service: synapse
            exp_annotations:
              summary: "Чат не отвечает уже больше 2 минут."
              resolved: "Чат снова отвечает."
  - interval: 1m
    input_series:
      - series: 'probe_success{job="probe", project="chat", service="synapse"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: HomeserverDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/disk", fstype="ext4", mountpoint="/"}'
        values: "10x20"
      - series: 'node_filesystem_size_bytes{device="/dev/disk", fstype="ext4", mountpoint="/"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 12m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: page
              device: /dev/disk
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "Мало места на диске: свободно меньше 15%."
              resolved: "Места на диске снова достаточно."
  - interval: 1m
    input_series:
      - series: 'up{project="egress", service="status"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressStatusSeriesMissing
        exp_alerts:
          - exp_labels:
              severity: page
              project: egress
              service: status
            exp_annotations:
              summary: "Egress не публикует состояние проверок."
              resolved: "Состояние исходящих проверок снова доступно."
  - interval: 1m
    input_series:
      - series: 'egress_ready{project="egress"}'
        values: "1x10"
      - series: 'egress_probe_ready{project="egress", profile="system", upstream="primary", protocol="http"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressUpstreamDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              project: egress
              upstream: primary
            exp_annotations:
              summary: "Один из исходящих каналов недоступен; рабочий путь сохранён."
              resolved: "Исходящий канал восстановлен."

  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: EgressStatusSeriesMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: EgressUpstreamDegraded
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'egress_ready{project="egress"}'
        values: "0x10"
      - series: 'egress_probe_ready{project="egress", profile="system", upstream="primary", protocol="http"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: EgressUpstreamDegraded
        exp_alerts: []
